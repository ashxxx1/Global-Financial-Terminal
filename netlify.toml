# Netlify configuration for Global Financial Terminal (Vite + React SPA)

[build]
  command = "npm run build"
  publish = "dist"

# SPA fallback — every route serves index.html so client-side routing works
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

# Security headers (ported from the old vercel.json)
[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    X-Frame-Options = "SAMEORIGIN"
    X-XSS-Protection = "1; mode=block"

# Long-cache hashed static assets
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
