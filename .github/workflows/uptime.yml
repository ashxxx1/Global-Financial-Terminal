name: Uptime

# Growth-plan item 22. Runs on GitHub's own schedule, so there is no vendor,
# no key and no monthly cost.
#
# A plain 200 check on the homepage would be close to useless here: this is a
# static SPA on Vercel's CDN, so the shell keeps returning 200 long after the
# data behind it has died. Every real outage we have had was the quote proxy
# rate-limiting or losing its key while the page still rendered perfectly. So
# the check asserts on the data path, not just the document.

on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:

permissions:
  # Both are required. Naming a permissions block sets every scope you do not
  # list to none, so omitting contents:read here fails actions/checkout with a
  # bare "git exit 128" that looks nothing like a permissions problem.
  contents: read
  issues: write

concurrency:
  group: uptime
  cancel-in-progress: false

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Probe production
        id: probe
        run: node scripts/uptime-probe.mjs
        env:
          SITE: https://global-financial-terminal-eight.vercel.app

      # Alerting. An outage that only shows up in a workflow log nobody reads
      # is not monitoring, so a failure opens a GitHub issue — which emails and
      # pushes a notification through GitHub's own delivery.
      - name: Open or update the outage issue
        if: failure()
        uses: actions/github-script@v7
        with:
          script: |
            const title = "🔴 Production probe failing";
            const body = [
              `The uptime probe failed at ${new Date().toISOString()}.`,
              "",
              `Run: ${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`,
              "",
              "Check, in order: Vercel deployment status, the FINNHUB_API_KEY env var,",
              "and whether /api/quote is returning 429 (rate limit) rather than data.",
            ].join("\n");
            const existing = await github.rest.issues.listForRepo({
              owner: context.repo.owner, repo: context.repo.repo,
              state: "open", labels: "uptime",
            });
            if (existing.data.length > 0) {
              await github.rest.issues.createComment({
                owner: context.repo.owner, repo: context.repo.repo,
                issue_number: existing.data[0].number, body,
              });
            } else {
              await github.rest.issues.create({
                owner: context.repo.owner, repo: context.repo.repo,
                title, body, labels: ["uptime"],
              });
            }

      # Recovery matters as much as the alarm — an issue that stays open after
      # the site comes back trains you to ignore the next one.
      - name: Close the outage issue on recovery
        if: success()
        uses: actions/github-script@v7
        with:
          script: |
            const open = await github.rest.issues.listForRepo({
              owner: context.repo.owner, repo: context.repo.repo,
              state: "open", labels: "uptime",
            });
            for (const issue of open.data) {
              await github.rest.issues.createComment({
                owner: context.repo.owner, repo: context.repo.repo,
                issue_number: issue.number,
                body: `✅ Recovered at ${new Date().toISOString()} — probe passing again.`,
              });
              await github.rest.issues.update({
                owner: context.repo.owner, repo: context.repo.repo,
                issue_number: issue.number, state: "closed",
              });
            }
